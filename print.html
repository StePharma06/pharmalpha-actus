<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharm'Actus — Impression du jour</title>
<link rel="preload" href="/assets/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/space-grotesk-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/space-grotesk.css?v=20260824a">
<style>
  :root {
    --bg: #ffffff; --bg-alt: #f8f8f8;
    --border: #e5e5e5; --border-light: #efefef;
    --text: #1a1a1a; --text-secondary: #555; --text-muted: #888;
    --orange: #ff914d; --orange-light: #fff5ed;
    --indigo: #4f46e5; --indigo-light: #eef2ff;
    --purple: #7c3aed; --purple-light: #f5f3ff;
    --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; background: var(--bg-alt); color: var(--text); }

  /* === HEADER WEB (visible a l ecran, masque a l impression) === */
  .header { background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .logo-area { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .logo-area img { height: 60px; width: auto; display: block; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .header-link {
    display: flex; align-items: center; gap: 6px; color: var(--text-secondary);
    text-decoration: none; font-size: 13px; font-weight: 500;
    padding: 7px 14px; border-radius: 100px; border: 1px solid var(--border); transition: all 0.2s;
  }
  .header-link:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-light); }
  .header-link svg { width: 16px; height: 16px; flex-shrink: 0; }
  .btn-print-header {
    display: flex; align-items: center; gap: 6px;
    background: var(--orange); color: #fff; border: none;
    font-size: 13px; font-weight: 700; padding: 8px 18px; border-radius: 100px;
    cursor: pointer; font-family: inherit; transition: background 0.15s;
  }
  .btn-print-header:hover { background: #f08236; }
  .btn-print-header svg { width: 15px; height: 15px; }
  .btn-share {
    display: flex; align-items: center; gap: 6px; color: var(--text-secondary);
    background: none; border: 1px solid var(--border); font-size: 13px; font-weight: 500;
    padding: 7px 14px; border-radius: 100px; cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .btn-share:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-light); }
  .btn-share svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* === CONTENU PRINT === */
  .page-wrapper { max-width: 210mm; margin: 24px auto; background: #fff; border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
  .content { padding: 0 14mm 12mm; }

  /* --- Bandeau Pharm'Alpha noir en haut (identite de marque) --- */
  .brand-strip {
    background: #1a1a1a;
    padding: 14px 0;
    text-align: center;
    margin-bottom: 12px;
  }
  .brand-strip img {
    height: 28px; width: auto; display: inline-block; vertical-align: middle;
    filter: brightness(0) invert(1);
  }

  /* --- En-tete Pharm'Actus (logo + date) --- */
  .print-header {
    border-bottom: 2px solid #1a1a1a; padding-bottom: 9px; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .print-logo-actus { height: 26pt; width: auto; display: block; }
  .print-meta { text-align: right; font-size: 8.5pt; color: #666; line-height: 1.5; }
  .print-meta .date-label { font-size: 11pt; font-weight: 700; color: #1a1a1a; }

  /* --- Expression du jour (tout en haut, bulle indigo) --- */
  .expr-box {
    background: var(--indigo-light);
    border: 1.5px solid var(--indigo); border-radius: 9px;
    padding: 11px 14px; display: grid; grid-template-columns: auto 1fr; gap: 11px; align-items: start;
    margin-bottom: 12px;
    break-inside: avoid; page-break-inside: avoid;
  }
  .expr-label {
    font-size: 7.5pt; font-weight: 900; text-transform: uppercase; letter-spacing: 0.4px;
    color: #fff; background: var(--indigo); padding: 3px 9px; border-radius: 100px; white-space: nowrap; margin-top: 1px;
  }
  .expr-title { font-size: 10.5pt; font-weight: 700; line-height: 1.3; margin-bottom: 3px; color: #2b1f7a; }
  .expr-body { font-size: 9pt; color: #3d3470; line-height: 1.5; }

  /* --- 6 actus en grid 2 colonnes (3 lignes x 2 cols), aerees --- */
  .articles-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .article-card {
    display: grid; grid-template-columns: 56px 1fr;
    gap: 11px; padding: 10px 12px;
    background: #fff;
    border: 1px solid var(--border-light); border-radius: 8px;
    break-inside: avoid; page-break-inside: avoid;
  }
  .art-thumb {
    width: 56px; height: 44px; border-radius: 5px; overflow: hidden; flex-shrink: 0; align-self: start;
  }
  .art-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art-thumb-empty { background: #f3f4f6; }

  .art-content { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cat-badge {
    display: inline-block; padding: 2px 8px; border-radius: 100px;
    font-size: 7pt; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; line-height: 1.4; margin-bottom: 2px;
    align-self: start;
  }
  .cat-pharma_france     { background: var(--orange-light); color: var(--orange); }
  .cat-pharma_monde      { background: #f5f3ff; color: #6d28d9; }
  .cat-bonne_nouvelle    { background: #f0fdf6; color: #166534; }
  .cat-avenir_pharma     { background: var(--indigo-light); color: var(--indigo); }
  .cat-business_officine { background: #fff9f5; color: #c2410c; }
  .cat-sante             { background: #f2fbf4; color: #15803d; }
  .cat-default           { background: #f8f8f8; color: #374151; }

  .article-title { font-size: 9.5pt; font-weight: 700; line-height: 1.25; color: #1a1a1a; }
  .article-summary { font-size: 8.5pt; color: #4a4a4a; line-height: 1.45; }
  .article-source { font-size: 7pt; color: #999; margin-top: 2px; font-style: italic; }

  /* --- LSV (violet, aere) --- */
  .lsv-box {
    background: var(--purple-light);
    border: 1.5px solid var(--purple); border-radius: 9px;
    padding: 11px 14px; display: grid; grid-template-columns: auto 1fr; gap: 11px; align-items: start;
    margin-bottom: 14px;
    break-inside: avoid; page-break-inside: avoid;
  }
  .lsv-label {
    font-size: 7.5pt; font-weight: 900; text-transform: uppercase; letter-spacing: 0.4px;
    color: #fff; background: var(--purple); padding: 3px 9px; border-radius: 100px; white-space: nowrap; margin-top: 1px;
  }
  .lsv-title { font-size: 10.5pt; font-weight: 700; line-height: 1.3; margin-bottom: 3px; color: #3b1d8a; }
  .lsv-summary { font-size: 9pt; color: #4b3a72; line-height: 1.5; }

  /* --- Bandeau bio Stephen + QR code (compact, 3 colonnes) --- */
  .signature-card {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    align-items: center;
    break-inside: avoid; page-break-inside: avoid;
  }
  .sig-avatar {
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--orange);
    overflow: hidden;
    flex-shrink: 0;
  }
  .sig-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sig-name { font-size: 11pt; font-weight: 800; color: #1a1a1a; margin-bottom: 1px; letter-spacing: -0.2px; }
  .sig-role { font-size: 8pt; color: var(--orange); font-weight: 700; margin-bottom: 4px; }
  .sig-desc { font-size: 7.5pt; color: #666; line-height: 1.45; }
  .sig-qr-block { display: flex; align-items: center; gap: 10px; }
  .sig-qr-text { font-size: 8pt; color: var(--text-secondary); line-height: 1.4; text-align: right; max-width: 110px; }
  .sig-qr-text strong { color: #1a1a1a; }
  .sig-qr-block img {
    width: 74px; height: 74px; flex-shrink: 0;
    image-rendering: crisp-edges;
    background: #fff;
  }

  .loading { padding: 40px; text-align: center; color: #666; }

  .print-tip {
    background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
    font-size: 12px; padding: 8px 14px; border-radius: 8px;
    margin: 12px auto; max-width: 210mm;
    text-align: center;
  }
  .print-tip strong { color: #78350f; }

  /* === PRINT MEDIA === */
  @media print {
    @page { size: A4 portrait; margin: 8mm 9mm; }
    body { background: #fff; font-size: 10pt; }
    .header, .print-tip { display: none !important; }
    .page-wrapper { max-width: 100%; margin: 0; border-radius: 0; box-shadow: none; overflow: visible; }
    .content { padding: 0; }
    .brand-strip { margin: -8mm -9mm 12px; padding: 12px 0; }
    a { color: inherit; text-decoration: none; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
  }

  @media (max-width: 600px) {
    .logo-area img { height: 44px; }
    .header-inner { padding: 10px 16px; }
    .page-wrapper { margin: 0; border-radius: 0; }
    .content { padding: 0 14px 14px; }
    .articles-grid { grid-template-columns: 1fr; }
    .signature-card { grid-template-columns: 1fr; gap: 12px; }
    .sig-qr-block { justify-content: flex-start; }
    .sig-qr-text { text-align: left; }
  }
</style>
</head>
<body>

<!-- HEADER WEB - masque a l impression -->
<header class="header">
  <div class="header-inner">
    <div class="logo-area">
      <img src="assets/logo_pharmactus.png" alt="Pharm'Actus">
    </div>
    <div class="header-right">
      <button class="btn-share" onclick="sharePage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Partager
      </button>
      <button class="btn-print-header" onclick="window.print()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Imprimer
      </button>
      <a href="index.html" class="header-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Archives
      </a>
    </div>
  </div>
</header>

<div class="print-tip">
  💡 <strong>Conseil</strong> : dans la boite d'impression, decoche "En-tetes et pieds de page" pour un rendu nickel (Chrome &gt; Plus de parametres).
</div>

<div class="page-wrapper">
  <div id="container"><p class="loading">Chargement des actus...</p></div>
</div>

<script>
var CAT_LABELS = {
  pharma_france:"France", pharma_monde:"Monde", bonne_nouvelle:"Bonne nouvelle",
  avenir_pharma:"Avenir pharma", business_officine:"Business", sante:"Santé"
};
var MONTHS = ["","janv.","fév.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtDate(d) {
  var p = d.split("-").map(Number);
  var dt = new Date(p[0], p[1]-1, p[2]);
  return DAYS[dt.getDay()]+" "+p[2]+" "+MONTHS[p[1]]+" "+p[0];
}
function catClass(c) { return "cat-"+(c||"default"); }
function catLabel(c) { return CAT_LABELS[c]||c||""; }

function buildHtml(articles, lsv, expr, displayDate) {
  var html = "";

  // Bandeau noir Pharm'Alpha (identite de marque)
  html += "<div class=\"brand-strip\">";
  html += "<img src=\"assets/logo_pharmalpha_wide.png\" alt=\"Pharm'Alpha\">";
  html += "</div>";

  html += "<div class=\"content\">";

  // En-tete Pharm'Actus + date
  html += "<div class=\"print-header\">";
  html += "<img src=\"assets/logo_pharmactus.png\" alt=\"Pharm'Actus\" class=\"print-logo-actus\">";
  html += "<div class=\"print-meta\"><div class=\"date-label\">"+esc(fmtDate(displayDate))+"</div><div>pharmalpha.fr/actus</div></div>";
  html += "</div>";

  // Expression du jour TOUT EN HAUT
  var hasExpr = !!(expr && expr.expression);
  if (hasExpr) {
    var texte = (expr.texte||"").replace(/\*\*([^*]+)\*\*/g,"$1").replace(/\*([^*]+)\*/g,"$1").replace(/\n+/g," ").trim();
    html += "<div class=\"expr-box\">";
    html += "<div class=\"expr-label\">Expression du jour</div><div>";
    html += "<div class=\"expr-title\">"+esc(expr.expression)+"</div>";
    html += "<div class=\"expr-body\">"+esc(texte)+"</div>";
    html += "</div></div>";
  }

  // 6 actus en 2 colonnes
  html += "<div class=\"articles-grid\">";
  articles.slice(0, 6).forEach(function(a) {
    var cat = a.categorie || "default";
    var imgUrl = a.image_url || "";
    html += "<div class=\"article-card\">";
    if (imgUrl) {
      html += "<div class=\"art-thumb\"><img src=\""+esc(imgUrl)+"\" alt=\"\" onerror=\"this.parentNode.className='art-thumb art-thumb-empty'\"></div>";
    } else {
      html += "<div class=\"art-thumb art-thumb-empty\"></div>";
    }
    html += "<div class=\"art-content\">";
    html += "<span class=\"cat-badge "+catClass(cat)+"\">"+esc(catLabel(cat))+"</span>";
    html += "<div class=\"article-title\">"+esc(a.titre||a.title||"")+"</div>";
    html += "<div class=\"article-summary\">"+esc(a.resume||a.summary||"")+"</div>";
    if (a.source) html += "<div class=\"article-source\">"+esc(a.source)+"</div>";
    html += "</div>";
    html += "</div>";
  });
  html += "</div>";

  // LSV
  if (lsv) {
    html += "<div class=\"lsv-box\">";
    html += "<div class=\"lsv-label\">Le saviez-vous ?</div><div>";
    html += "<div class=\"lsv-title\">"+esc(lsv.titre||lsv.title||"")+"</div>";
    html += "<div class=\"lsv-summary\">"+esc(lsv.resume||lsv.summary||"")+"</div>";
    html += "</div></div>";
  }

  // Bandeau bio Stephen + QR code
  html += "<div class=\"signature-card\">";
  html += "<div class=\"sig-avatar\"><img src=\"assets/stephen.png\" alt=\"Stephen ROBERT\"></div>";
  html += "<div>";
  html += "<div class=\"sig-name\">Stephen ROBERT</div>";
  html += "<div class=\"sig-role\">Consultant, Formateur &amp; Communicant Pharma</div>";
  html += "<div class=\"sig-desc\">Docteur en Pharmacie, dipl&ocirc;m&eacute; d'un Mast&egrave;re Marketing &amp; Management des Industries de Sant&eacute;. Je d&eacute;crypte l'actu pharma chaque matin pour que tu restes <em>in</em>.</div>";
  html += "</div>";
  html += "<div class=\"sig-qr-block\">";
  html += "<div class=\"sig-qr-text\">Retrouve toute l'actu<br><strong>en scannant ce QR</strong></div>";
  html += "<img src=\"https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https%3A%2F%2Fpharmalpha.fr%2Factus&color=1a1a1a&bgcolor=ffffff&qzone=1&format=png\" alt=\"QR Code pharmalpha.fr/actus\">";
  html += "</div>";
  html += "</div>";

  html += "</div>"; // fin .content

  return html;
}

function sharePage() {
  var url = "https://pharmalpha.fr/actus/print";
  var title = "Pharm’Actus, Impression du jour";
  if (navigator.share) {
    navigator.share({ title: title, url: url }).catch(function(){});
  } else {
    navigator.clipboard.writeText(url).then(function() {
      var btn = document.querySelector(".btn-share");
      var orig = btn.innerHTML;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><polyline points="20 6 9 17 4 12"/></svg> Lien copié !';
      setTimeout(function(){ btn.innerHTML = orig; }, 2000);
    }).catch(function(){ window.prompt("Copiez ce lien :", url); });
  }
}

function render() {
  var container = document.getElementById("container");
  var p1 = fetch("articles.json").then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
  var p2 = fetch("expression.json").then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  Promise.all([p1, p2]).then(function(results) {
    var raw = results[0], expr = results[1];
    var all = Array.isArray(raw) ? raw : (raw.articles||[]);
    var today = new Date().toISOString().slice(0,10);
    var todayArts = all.filter(function(a){ return a.date===today && a.categorie!=="lsv"; });
    var todayLsv  = all.filter(function(a){ return a.date===today && a.categorie==="lsv"; })[0];
    var articles = todayArts.length>0 ? todayArts : all.filter(function(a){ return a.categorie!=="lsv"; }).slice(0,6);
    var lsv = todayLsv || all.filter(function(a){ return a.categorie==="lsv"; })[0];
    var displayDate = todayArts.length>0 ? today : (articles[0]&&articles[0].date||today);
    container.innerHTML = buildHtml(articles, lsv, expr, displayDate);
    var imgs = Array.from(container.querySelectorAll("img"));
    Promise.all(imgs.map(function(img) {
      return img.complete ? Promise.resolve() : new Promise(function(r) { img.onload = img.onerror = r; });
    })).then(function() {
      setTimeout(function() { window.print(); }, 150);
    });
  }).catch(function(e) {
    container.textContent = "Erreur chargement : " + e.message;
  });
}
render();
</script>
</body>
</html>
