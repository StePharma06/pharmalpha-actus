<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharm'Actus — Impression du jour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script defer src="assets/site-nav.js"></script>
<style>
  :root {
    --bg: #ffffff; --bg-alt: #f8f8f8;
    --border: #e5e5e5; --text: #1a1a1a; --text-secondary: #555; --text-muted: #888;
    --orange: #ff914d; --orange-light: #fff5ed;
    --indigo: #4f46e5; --indigo-light: #eef2ff;
    --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; background: var(--bg-alt); color: var(--text); }

  /* === HEADER (identique au site actus) === */
  .header { background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .logo-area { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .logo-area img { height: 60px; width: auto; display: block; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .header-link {
    display: flex; align-items: center; gap: 6px; color: var(--text-secondary);
    text-decoration: none; font-size: 13px; font-weight: 500;
    padding: 7px 14px; border-radius: 100px; border: 1px solid var(--border); transition: all 0.2s;
  }
  .header-link:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-light); }
  .header-link svg { width: 16px; height: 16px; flex-shrink: 0; }
  .btn-print-header {
    display: flex; align-items: center; gap: 6px;
    background: var(--orange); color: #fff; border: none;
    font-size: 13px; font-weight: 700; padding: 8px 18px; border-radius: 100px;
    cursor: pointer; font-family: inherit; transition: background 0.15s;
  }
  .btn-print-header:hover { background: #f08236; }
  .btn-print-header svg { width: 15px; height: 15px; }

  /* === CONTENU PRINT === */
  .page-wrapper { max-width: 210mm; margin: 24px auto; background: #fff; border-radius: 8px; box-shadow: var(--shadow); }
  .content { padding: 18mm 18mm 14mm; }

  .print-header {
    border-bottom: 3px solid #1a1a1a; padding-bottom: 10px; margin-bottom: 16px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .print-header .brand { font-size: 24pt; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
  .print-header .brand span { color: var(--orange); }
  .print-header .meta { text-align: right; font-size: 9pt; color: #666; line-height: 1.6; }
  .print-header .meta .date-label { font-size: 11pt; font-weight: 700; color: #1a1a1a; }

  .article-row {
    display: grid; grid-template-columns: 72px 1fr;
    gap: 0 12px; padding: 10px 0; border-bottom: 1px solid #e5e5e5; align-items: start;
  }
  .cat-badge {
    display: inline-block; padding: 3px 7px; border-radius: 4px;
    font-size: 7.5pt; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.3px; text-align: center; line-height: 1.4; margin-top: 3px;
  }
  .cat-pharma_france     { background: #dbeafe; color: #1e40af; }
  .cat-pharma_monde      { background: #ede9fe; color: #6d28d9; }
  .cat-bonne_nouvelle    { background: #dcfce7; color: #166534; }
  .cat-avenir_pharma     { background: #fef9c3; color: #854d0e; }
  .cat-business_officine { background: #ffedd5; color: #c2410c; }
  .cat-sante             { background: #f0fdf4; color: #15803d; }
  .cat-default           { background: #f3f4f6; color: #374151; }

  .article-title { font-size: 11pt; font-weight: 700; line-height: 1.35; margin-bottom: 4px; }
  .article-summary { font-size: 9.5pt; color: #444; line-height: 1.5; }
  .article-source { font-size: 8pt; color: #888; margin-top: 3px; }

  .lsv-box {
    margin-top: 14px; border: 1.5px solid #1a1a1a; border-radius: 4px;
    padding: 10px 14px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  }
  .lsv-label {
    font-size: 8pt; font-weight: 900; text-transform: uppercase; letter-spacing: 0.3px;
    color: #fff; background: #1a1a1a; padding: 3px 7px; border-radius: 3px; white-space: nowrap; margin-top: 2px;
  }
  .lsv-title { font-size: 10pt; font-weight: 700; line-height: 1.3; margin-bottom: 3px; }
  .lsv-summary { font-size: 9pt; color: #444; line-height: 1.45; }

  .expr-box {
    margin-top: 10px; border: 1.5px solid var(--indigo); border-radius: 4px;
    padding: 10px 14px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  }
  .expr-label {
    font-size: 8pt; font-weight: 900; text-transform: uppercase; letter-spacing: 0.3px;
    color: #fff; background: var(--indigo); padding: 3px 7px; border-radius: 3px; white-space: nowrap; margin-top: 2px;
  }
  .expr-title { font-size: 10pt; font-weight: 700; line-height: 1.3; margin-bottom: 3px; color: #1a1a1a; }
  .expr-body { font-size: 9pt; color: #444; line-height: 1.45; }

  .print-footer {
    margin-top: 14px; border-top: 1px solid #e5e5e5; padding-top: 8px;
    display: flex; justify-content: space-between;
  }
  .print-footer p { font-size: 8pt; color: #999; }
  .loading { padding: 40px; text-align: center; color: #666; }

  /* === PRINT MEDIA === */
  @media print {
    @page { size: A4; margin: 15mm 18mm 12mm; }
    body { background: #fff; }
    .header { display: none !important; }
    .page-wrapper { max-width: 100%; margin: 0; border-radius: 0; box-shadow: none; }
    .content { padding: 0; }
    a { color: inherit; text-decoration: none; }
  }

  @media (max-width: 600px) {
    .logo-area img { height: 44px; }
    .header-inner { padding: 10px 16px; }
    .page-wrapper { margin: 0; border-radius: 0; }
    .content { padding: 14px; }
  }
</style>
</head>
<body>

<!-- HEADER — identique au site actus -->
<header class="header">
  <div class="header-inner">
    <div class="logo-area">
      <img src="assets/logo_pharmactus.png" alt="Pharm'Actus">
    </div>
    <div class="header-right">
      <a href="index.html" class="header-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Accueil
      </a>
      <button class="btn-print-header" onclick="window.print()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Imprimer
      </button>
    </div>
  </div>
</header>

<div class="page-wrapper">
  <div class="content">
    <div id="container"><p class="loading">Chargement des actus...</p></div>
  </div>
</div>

<script>
var CAT_LABELS = {
  pharma_france:"France", pharma_monde:"Monde", bonne_nouvelle:"Bonne nouvelle",
  avenir_pharma:"Avenir pharma", business_officine:"Business", sante:"Santé"
};
var MONTHS = ["","janv.","fév.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
var DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtDate(d) {
  var p = d.split("-").map(Number);
  var dt = new Date(p[0], p[1]-1, p[2]);
  return DAYS[dt.getDay()]+" "+p[2]+" "+MONTHS[p[1]]+" "+p[0];
}
function catClass(c) { return "cat-"+(c||"default"); }
function catLabel(c) { return CAT_LABELS[c]||c||""; }

function buildHtml(articles, lsv, expr, displayDate) {
  var html = "";
  html += "<div class=\"print-header\">";
  html += "<div class=\"brand\">Pharm<span>'</span>Actus</div>";
  html += "<div class=\"meta\"><div class=\"date-label\">"+esc(fmtDate(displayDate))+"</div><div>pharmalpha.fr/actus</div></div>";
  html += "</div><div>";

  articles.slice(0,6).forEach(function(a) {
    var cat = a.categorie||"default";
    html += "<div class=\"article-row\">";
    html += "<div><span class=\"cat-badge "+catClass(cat)+"\">"+esc(catLabel(cat))+"</span></div>";
    html += "<div>";
    html += "<div class=\"article-title\">"+esc(a.titre||a.title||"")+"</div>";
    html += "<div class=\"article-summary\">"+esc(a.resume||a.summary||"")+"</div>";
    html += "<div class=\"article-source\">"+esc(a.source||"")+"</div>";
    html += "</div></div>";
  });
  html += "</div>";

  if (lsv) {
    html += "<div class=\"lsv-box\">";
    html += "<div class=\"lsv-label\">Le saviez-vous ?</div><div>";
    html += "<div class=\"lsv-title\">"+esc(lsv.titre||lsv.title||"")+"</div>";
    html += "<div class=\"lsv-summary\">"+esc(lsv.resume||lsv.summary||"")+"</div>";
    html += "</div></div>";
  }

  if (expr && expr.expression) {
    var texte = (expr.texte||"").replace(/\*\*([^*]+)\*\*/g,"$1").replace(/\*([^*]+)\*/g,"$1").replace(/\n+/g," ").trim();
    html += "<div class=\"expr-box\">";
    html += "<div class=\"expr-label\">Expression du jour</div><div>";
    html += "<div class=\"expr-title\">"+esc(expr.expression)+"</div>";
    html += "<div class=\"expr-body\">"+esc(texte)+"</div>";
    html += "</div></div>";
  }

  html += "<div class=\"print-footer\">";
  html += "<p>Pharm'Actus par <strong>Stephen ROBERT</strong> — Pharm'Alpha</p>";
  html += "<p>pharmalpha.fr/actus</p></div>";
  return html;
}

function render() {
  var container = document.getElementById("container");
  var p1 = fetch("articles.json").then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
  var p2 = fetch("expression.json").then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  Promise.all([p1, p2]).then(function(results) {
    var raw = results[0], expr = results[1];
    var all = Array.isArray(raw) ? raw : (raw.articles||[]);
    var today = new Date().toISOString().slice(0,10);
    var todayArts = all.filter(function(a){ return a.date===today && a.categorie!=="lsv"; });
    var todayLsv  = all.filter(function(a){ return a.date===today && a.categorie==="lsv"; })[0];
    var articles = todayArts.length>0 ? todayArts : all.filter(function(a){ return a.categorie!=="lsv"; }).slice(0,6);
    var lsv = todayLsv || all.filter(function(a){ return a.categorie==="lsv"; })[0];
    var displayDate = todayArts.length>0 ? today : (articles[0]&&articles[0].date||today);
    container.innerHTML = buildHtml(articles, lsv, expr, displayDate);
  }).catch(function(e) {
    container.innerHTML = "<p class=\"loading\">Erreur chargement : "+esc(e.message)+"</p>";
  });
}
render();
</script>
</body>
</html>
