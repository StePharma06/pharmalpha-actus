name: TikTok Video Daily

on:
  schedule:
    - cron: '0 2 * * *'  # 04h00 Paris — generation quotidienne
  workflow_dispatch:  # Lancement manuel

permissions:
  contents: write

jobs:
  tiktok-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate TikTok video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_IDS: ${{ secrets.HEYGEN_AVATAR_IDS }}
          CREATOMATE_API_KEY: ${{ secrets.CREATOMATE_API_KEY }}
        run: python scripts/generate_tiktok.py

      - name: Commit video to queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/tiktok/queue/
          if git diff --staged --quiet; then
            echo "Rien a committer"
          else
            git commit -m "tiktok: video du $(date +%Y-%m-%d) en queue (publication J+2)"
            git push
          fi

      - name: Upload artifact (backup 7j)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video-${{ github.run_number }}
          path: |
            output/tiktok/queue/
            output/tiktok/*.json
          retention-days: 7
