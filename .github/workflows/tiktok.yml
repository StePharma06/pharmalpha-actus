name: TikTok Video Daily

on:
  schedule:
    - cron: '0 2 * * *'  # 04h00 Paris — generation quotidienne
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tiktok-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome/Chromium dependencies for Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: Install Remotion dependencies
        working-directory: tiktok-renderer
        run: npm install --no-audit --no-fund

      - name: Install Python dependencies (Pillow + imageio for cover generation)
        run: pip install --quiet Pillow imageio imageio-ffmpeg

      - name: Generate TikTok video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIEAI_API_KEY: ${{ secrets.KIEAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python scripts/generate_tiktok.py

      - name: Commit video to queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/tiktok/queue/
          if git diff --staged --quiet; then
            echo "Rien a committer"
          else
            git commit -m "tiktok: video du $(date +%Y-%m-%d) en queue (publication J+2)"
            for i in 1 2 3; do
              git pull --rebase origin master || true
              if git push origin master; then
                echo "Push reussi (tentative $i)"
                break
              fi
              echo "Push echoue (tentative $i), retry..."
              sleep 5
            done
          fi

      - name: Upload artifact (backup 7j)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video-${{ github.run_number }}
          path: |
            output/tiktok/queue/
            output/tiktok/*.json
            output/tiktok/*.mp4
          retention-days: 7
