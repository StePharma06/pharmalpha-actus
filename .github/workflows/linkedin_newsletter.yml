name: LinkedIn Newsletter Weekly

on:
  # 1. Déclencheur primaire : cron-job.org (fiable, heure exacte)
  #    POST .../dispatches  body: {"event_type":"send-linkedin-newsletter"}  vendredi 05h UTC
  repository_dispatch:
    types: [send-linkedin-newsletter]

  # 2. Filet de secours : cron GitHub natif (vendredi 05h UTC)
  schedule:
    - cron: '0 5 * * 5'

  # 3. Lancement manuel
  workflow_dispatch:

# IDEMPOTENCE : le script n'envoie qu'UNE fois par semaine ISO (marqueur
# output/linkedin_newsletter_sent.json). Même si les 2 déclencheurs tirent le
# même vendredi, un seul email part. (Le déclencheur workflow_run après chaque
# daily-update a été retiré : il causait un triple envoi le vendredi.)

permissions:
  contents: write

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic pillow

      - name: Generate + send LinkedIn newsletter draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python scripts/generate_linkedin_newsletter.py

      - name: Persist weekly sent-marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/linkedin_newsletter_sent.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Pas de marqueur à persister (déjà envoyé cette semaine, ou pas d'envoi)"
          else
            git commit -m "chore(linkedin): marqueur envoi hebdo $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              if git push; then echo "push OK"; break; fi
              git pull --rebase origin master || git rebase --abort
              sleep 3
            done
          fi
