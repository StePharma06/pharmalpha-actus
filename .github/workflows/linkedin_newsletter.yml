name: LinkedIn Newsletter Weekly

on:
  # 1. Déclencheur primaire : cron-job.org (fiable, heure exacte)
  #    POST https://api.github.com/repos/StePharma06/pharmalpha-actus/dispatches
  #    body: {"event_type":"send-linkedin-newsletter"}   — chaque vendredi 05h00 UTC
  repository_dispatch:
    types: [send-linkedin-newsletter]

  # 2. Backup automatique : se déclenche après le daily-update du vendredi
  #    Si cron-job.org rate ou que le repo_dispatch échoue, le workflow_run
  #    prend le relai. Le job vérifie lui-même si c'est vendredi avant d'envoyer.
  workflow_run:
    workflows: ["Daily Actus Update"]
    types: [completed]
    branches: [master]

  # 3. Cron GitHub natif (peu fiable mais conservé en ultime filet)
  schedule:
    - cron: '0 5 * * 5'   # Vendredi 05h00 UTC = 07h00 Paris

  # 4. Lancement manuel possible depuis l'interface GitHub Actions
  workflow_dispatch:

jobs:
  newsletter:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      # Pour le déclencheur workflow_run (qui tire tous les jours) :
      # on vérifie que c'est vendredi avant de continuer.
      - name: Vérification jour (workflow_run uniquement)
        id: gate
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_run" ]; then
            DOW=$(date -u +%u)   # 1=Lun … 5=Ven … 7=Dim
            if [ "$DOW" != "5" ]; then
              echo "Pas vendredi (DOW=$DOW) — newsletter ignorée"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install anthropic pillow

      - name: Generate + send LinkedIn newsletter draft
        if: steps.gate.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python scripts/generate_linkedin_newsletter.py
