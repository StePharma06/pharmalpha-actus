name: LinkedIn Newsletter Weekly

on:
  repository_dispatch:
    types: [send-linkedin-newsletter]  # Declencheur principal : cron-job.org (vendredi 05h00 UTC)
  workflow_dispatch:                   # Lancement manuel si besoin
  # NOTE : cron GitHub natif SUPPRIME (best-effort, derivait de +1h a +3h chaque semaine).
  # Utiliser cron-job.org → POST https://api.github.com/repos/StePharma06/pharmalpha-actus/dispatches
  # Body: {"event_type":"send-linkedin-newsletter"} | Header: Authorization: Bearer <PAT>
  # Reglage cron-job.org : 0 5 * * 5 (vendredi 5h UTC = 7h Paris)

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic pillow

      - name: Generate + send LinkedIn newsletter draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python scripts/generate_linkedin_newsletter.py
