name: Daily Actus Update

on:
  repository_dispatch:
    types: [daily-update]  # Declenche via API externe (cron-job.org) → heure exacte garantie
  workflow_dispatch:  # Lancement manuel possible

permissions:
  contents: write

jobs:
  check-day:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.day-check.outputs.skip }}
    steps:
      - id: day-check
        run: |
          DAY=$(date -u +%u)   # 1=lundi ... 7=dimanche
          if [ "$DAY" = "7" ]; then
            echo "skip=true"  >> $GITHUB_OUTPUT
            echo "Dimanche detecte — envoi suspendu (regle Stephen)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Jour ouvrable ($DAY/7) — pipeline actif"
          fi

  update:
    needs: check-day
    if: needs.check-day.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic feedparser pytrends "urllib3<2"

      - name: Radar pharmacien (Google News 7j glissants)
        continue-on-error: true  # Ne jamais bloquer la pipeline si pytrends rate-limite
        run: python scripts/daily_trends.py

      - name: Fetch RSS, curate articles, generate LSV, fetch photos & send newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python scripts/update_actus.py

      - name: Commit & push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html articles.json assets/ articles/ output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update actus $(date -u +%Y-%m-%d)"
            # Push resilient : un cron concurrent (dashboard, trends...) peut avoir
            # avance origin/master entre le checkout et ce push -> non-fast-forward.
            # On rebase et on reessaie jusqu'a 5 fois avant d'abandonner.
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then pushed=true; echo "push OK (tentative $i)"; break; fi
              echo "push rejete, rebase + nouvelle tentative ($i)..."
              git pull --rebase origin master || git rebase --abort
              sleep 3
            done
            if [ "$pushed" != "true" ]; then echo "ERREUR: push impossible apres 5 tentatives"; exit 1; fi
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
