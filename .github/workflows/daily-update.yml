name: Daily Actus Update

on:
  schedule:
    # 5h UTC = 6h heure de Paris (hiver) / 7h (ete)
    # 4h UTC = 5h (hiver) / 6h (ete)
    - cron: '0 4 * * *'
  workflow_dispatch:  # Lancement manuel possible

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic feedparser

      - name: Fetch RSS & curate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_actus.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update actus $(date -u +%Y-%m-%d)"
            git push
          fi
