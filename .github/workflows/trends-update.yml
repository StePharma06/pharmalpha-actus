name: Weekly Trends Update
# Classement hebdomadaire marques CA + Cosméto via Google Trends

on:
  schedule:
    - cron: '0 6 * * 1'  # Lundi 6h UTC
  workflow_dispatch:      # Lancement manuel possible

permissions:
  contents: write

jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytrends
        run: pip install pytrends

      - name: Run weekly trends
        run: python scripts/weekly_trends.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update trends $(date -u +%G-W%V)"
            git push
          fi
