name: Sync to pharmalpha-site (Vercel)

# Mirror new actus content into pharmalpha-site/actus/ so Vercel
# serves the same articles under https://pharmalpha.fr/actus/.
#
# GitHub Pages deploy for this repo has been retired (Stephen validated
# the cut on 2026-07-28): DNS was already on Vercel, Pages was only
# serving a duplicate copy that diluted crawl budget (GSC "duplicate,
# no canonical"). This sync is now the ONLY publication path.

on:
  workflow_run:
    workflows: ["Daily Actus Update"]
    types: [completed]
    branches: [master]
  push:
    branches: [master]
    paths:
      - '*.html'
      # 'articles/**' est INDISPENSABLE : les articles PILLAR vivent dans des
      # sous-dossiers (articles/<theme>/*.html) et '*.html' ne matche QUE la
      # racine. Sans cette ligne, editer un pillar ne declenche aucune sync et
      # la correction n'arrive jamais en prod (vecu le 2026-07-28 : correction
      # de tarif restee bloquee jusqu'a un push racine sans rapport).
      - 'articles/**'
      - 'assets/**'
      - 'output/**'
      - 'articles.json'
      - 'scripts/sync_to_vercel.py'
  workflow_dispatch:

permissions:
  contents: read

# Un seul run à la fois : si un push rapide en déclenche plusieurs,
# le précédent est annulé avant que le suivant ne pousse → plus de race condition.
concurrency:
  group: sync-to-vercel
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pharmalpha-actus (source)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout pharmalpha-site (target)
        uses: actions/checkout@v4
        with:
          repository: StePharma06/pharmalpha-site
          token: ${{ secrets.PHARMALPHA_SITE_PAT }}
          path: target

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync content with URL transforms
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          TARGET_DIR: ${{ github.workspace }}/target
        run: python source/scripts/sync_to_vercel.py

      - name: Commit & push if changed
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # sitemap-actus.xml est regenere A LA RACINE par sync_to_vercel.py.
          # Sans ce add, il etait regenere puis jete a chaque run : Google n'a plus
          # decouvert un seul article entre le 2026-06-30 et le 2026-07-28.
          git add actus/ sitemap-actus.xml
          if git diff --staged --quiet; then
            echo "No changes to sync"
          else
            git commit -m "sync(actus): auto-sync from pharmalpha-actus $(date -u +%Y-%m-%d)"
            # Anti-course : pharmalpha-site recoit aussi des push manuels et
            # d'autres workflows. Sans retry+rebase, la sync echoue en silence
            # (vecu le 2026-08-20 : "rejected, fetch first" -> maillage jamais
            # propage en prod). Meme protection que gsc-weekly et cwv-canary.
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              echo "push rejete, rebase et nouvelle tentative ($i/5)"
              git pull --rebase origin main || exit 1
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "ECHEC : impossible de pousser apres 5 tentatives" >&2
              exit 1
            fi
          fi
