name: TikTok Publish

# SUSPENDU - pipeline TikTok mis en pause a la demande de Stephen (2026-04-11)
# Pour re-activer : decommenter le bloc 'schedule' ci-dessous
on:
  # schedule:
  #   - cron: '30 16 * * *'  # 18h30 Paris
  workflow_dispatch:  # Lancement manuel uniquement

permissions:
  contents: write

jobs:
  tiktok-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish oldest ready video
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python scripts/publish_tiktok.py

      - name: Commit publication status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/tiktok/queue/
          if git diff --staged --quiet; then
            echo "Rien a committer"
          else
            git commit -m "tiktok: video publiee le $(date +%Y-%m-%d)"
            git push
          fi
