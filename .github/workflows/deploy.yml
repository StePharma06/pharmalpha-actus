name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # Ne deploie QUE sur un vrai changement de contenu du site. Les push qui ne
    # touchent que le code/les workflows/les marqueurs ne changent pas le site
    # -> pas de deploiement (evitait un "Deployment failed" inutile + course Pages).
    paths-ignore:
      - 'scripts/**'
      - '.github/**'
      - 'output/**'
      - 'tiktok-renderer/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
